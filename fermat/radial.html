<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lean proof of Fermat's Last Theorem as a circle</title>
<link rel="icon" href="data:,">
<meta name="description" content="Radial tree of the 60,475 Lean files in the proof of Fermat's Last Theorem, with FinalCheck.lean at the centre.">
<style>
:root{
  color-scheme:light;
  --bg:#fcfcfb; --fg:#0b0b0b; --fg2:#52514e; --dim:#8a8984; --line:#e4e3de; --bar:#f4f3ef; --panel:#ffffff;
  --accent:#8a3b12; --hover:#efeee9; --edge:11,11,11;
  --g0:#2a78d6; --g1:#eb6834; --g2:#1baf7a; --g3:#eda100; --g4:#e87ba4; --g5:#008300; --g6:#6250d6; --g7:#9a9993;
}
@media (prefers-color-scheme:dark){
  :root{ color-scheme:dark;
    --bg:#1a1a19; --fg:#f0efec; --fg2:#c3c2b7; --dim:#85847c; --line:#33322f; --bar:#222220; --panel:#262624;
    --accent:#e6a26f; --hover:#30302d; --edge:240,239,236;
    --g0:#3987e5; --g1:#d95926; --g2:#199e70; --g3:#c98500; --g4:#d55181; --g5:#0ca30c; --g6:#9085e9; --g7:#77766f; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{flex:none;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 10px;
  background:var(--bar);border-bottom:1px solid var(--line);position:relative;z-index:6}
h1{font-size:13px;font-weight:650;margin:0;white-space:nowrap}
h1 span{color:var(--accent)}
input,button,.btn{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:3px 8px;height:26px;text-decoration:none;display:inline-flex;align-items:center}
button,.btn{cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent)}
input:focus,button:focus-visible,.btn:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#fq{flex:1 1 14em;min-width:0;max-width:34em}
.sp{margin-left:auto}
#res{position:absolute;left:10px;right:10px;top:100%;max-height:60vh;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:0 0 6px 6px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#res div{padding:3px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#res div:hover,#res div.on{background:var(--hover)}
#res .m{color:var(--dim);cursor:default;font-family:system-ui,sans-serif}
main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
canvas.drag{cursor:grabbing}
#zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
#zoom button{width:30px;height:30px;justify-content:center;font-size:16px;padding:0}
#zoom #zf{font-size:11px}
#tip{position:absolute;pointer-events:none;display:none;max-width:min(520px,90%);background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:6px 9px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:3}
#tip b{font:600 12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;display:block}
#tip span{color:var(--fg2)}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--fg2);pointer-events:none}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px 20px;min-height:0}
aside h2{font-size:15px;line-height:1.3;margin:0 0 6px;font-weight:650}
aside h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px;font-weight:600}
aside p{margin:6px 0;color:var(--fg2)}
.path{font:600 12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;color:var(--fg)}
.path i{font-style:normal;font-weight:400;color:var(--fg2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.stat b{display:block;font-size:19px;line-height:1.2;font-weight:650;font-variant-numeric:tabular-nums}
.stat span{color:var(--fg2);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.lg{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center}
.lg button{all:unset;display:contents;cursor:pointer}
.lg .sw{width:12px;height:12px;border-radius:3px}
.lg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .ct{color:var(--fg2);font-variant-numeric:tabular-nums;text-align:right}
.lg button:hover .nm{text-decoration:underline}
.lg button.off .nm,.lg button.off .ct{color:var(--dim)}
.lg button.off .sw{opacity:.25}
.lg button:focus-visible .nm{outline:2px solid var(--accent);outline-offset:2px}
ul.fl{list-style:none;margin:0;padding:0;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
ul.fl li{display:flex;gap:6px;align-items:center;padding:1px 4px;border-radius:4px;cursor:pointer}
ul.fl li:hover{background:var(--hover)}
ul.fl li i{flex:none;width:8px;height:8px;border-radius:2px}
ul.fl li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{color:var(--dim);font-size:12px;margin:4px 0 0}
a{color:var(--accent)}
kbd{font:inherit;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--bar)}
@media (max-width:760px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,44%)}
  aside{border-left:0;border-top:1px solid var(--line)}
  h1 .long{display:none}
}
#stp{display:inline-flex;align-items:center;white-space:nowrap}
#stp[hidden]{display:none}
#stp .lb{color:var(--fg2);margin-right:6px}
#stp button{border-radius:0;margin-left:-1px}
#stp button:first-of-type{border-radius:5px 0 0 5px;margin-left:0}
#stp button:last-of-type{border-radius:0 5px 5px 0}
#stp button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);position:relative;z-index:1}
@media (max-width:760px){ #stp .lb{display:none} }
.hist{display:flex;align-items:flex-end;gap:1px;height:64px;margin:8px 0 2px;border-bottom:1px solid var(--line)}
.hist div{flex:1 1 0;background:var(--g0);border-radius:2px 2px 0 0;min-height:1px;cursor:pointer}
.hist div:hover,.hist div.on{background:var(--fg)}
.hax{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
ol.chain{list-style:none;margin:0;padding:0;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
ol.chain li{display:flex;gap:6px;align-items:center;padding:1px 4px;border-radius:4px;cursor:pointer}
ol.chain li:hover{background:var(--hover)}
ol.chain li b{flex:none;width:2.2em;text-align:right;color:var(--dim);font-weight:400}
ol.chain li i{flex:none;width:8px;height:8px;border-radius:2px}
ol.chain li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.chain li.me span{font-weight:700}
.psel{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:5px;height:26px;padding:0 4px;max-width:15em;cursor:pointer}
.psel:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>
<header>
  <h1><span>FLT</span><span class="long" style="color:inherit"> · the proof as a circle</span></h1>
  <input id="fq" placeholder="Find a file by name…" aria-label="Find a file by name" autocomplete="off" spellcheck="false">
  <div id="stp" role="group" aria-label="How to count a theorem's statement file and proof file" hidden><span class="lb">Statement + proof</span><button id="sOne" aria-pressed="true" title="A theorem's statement file and proof file are drawn as one dot and count as one step">One step</button><button id="sTwo" aria-pressed="false" title="Every file is its own dot; going from a statement to its proof is a step">Two steps</button></div>
  <select id="proofSel" class="psel" aria-label="Show the same view of another proof" title="Show the same view of another proof"><option value="">RH, original (17.4M lines)</option><option value="rh-compact">RH, compact edition</option><option value="rh-readable">RH, readable edition</option><option value="fermat">Fermat's Last Theorem</option></select>
  <a class="btn sp" href="graph.html">Layered map</a>
  <a class="btn" href="index.html">Read the text →</a>
  <div id="res" role="listbox"></div>
</header>
<main>
  <div id="stage">
    <canvas id="cv" tabindex="0" aria-label="Radial tree of the proof's files around FinalCheck.lean. Use the search box and the side panel to explore it without a pointer."></canvas>
    <div id="zoom"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="zf" title="Show the whole circle">Fit</button></div>
    <div id="tip"></div>
    <div id="load">Loading 60,475 files and their imports…</div>
  </div>
  <aside id="side" aria-live="polite"></aside>
</main>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),side=$('side'),tip=$('tip'),fq=$('fq'),resEl=$('res');
var buf=document.createElement('canvas'),bctx=buf.getContext('2d');
var fmt=function(n){return n.toLocaleString('en-US')};
var GROUPS=[
  ['ModularCurve','ModularCurve'],
  ['AlgebraicGeometry','AlgebraicGeometry'],
  ['CerednikDrinfeld','CerednikDrinfeld'],
  ['AutomorphicForm','AutomorphicForm'],
  ['AlgebraicCurve','AlgebraicCurve'],
  ['LanglandsTunnell','LanglandsTunnell'],
  ['WeierstrassCurve','WeierstrassCurve'],
  [null,'All other topics']
];
var NG=GROUPS.length,TAU=Math.PI*2;
var part=null,rep=null,hid=null,merge=false,hasPairs=false;
var n=0,E=0,off,tg,roff,rtg,path,lower,start,grp,gcount=new Int32Array(NG);
var dist,par,bfs,size,th,wd,rad,kidOff,kids,ringOff,ringIds,nR=0,ringCount,MAIN=-1,mostUsed=0;
var edgeP=[],dotP=[];               /* world-space Path2D per folder colour */
var selEdgeP=null,selDotP=[],chainP=null,impP=null;
var s=1,tx=0,ty=0,W=0,H=0,dpr=1,fitS=1;
var sel=-1,hov=-1,iso=-1,raf=0,col=[],ink={},nSub=0,nUp=0;
var bS=0,bTx=0,bTy=0,bDirty=true,bT=0;  /* transform the cached bitmap was drawn at */

function gunzip(url,asText){
  return fetch(url).then(function(r){ if(!r.ok) throw new Error(url+' '+r.status); return r.arrayBuffer() }).then(function(ab){
    var b=new Uint8Array(ab),p;
    if(b[0]===0x1f&&b[1]===0x8b){
      if(typeof DecompressionStream==='undefined') throw new Error('This browser is too old to unpack the data.');
      p=new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip')));
    } else p=new Response(b);
    return asText?p.text():p.arrayBuffer();
  });
}
function readColors(){
  var cs=getComputedStyle(document.documentElement),g=function(k){return cs.getPropertyValue(k).trim()};
  col=[]; for(var i=0;i<NG;i++) col.push(g('--g'+i));
  ink={bg:g('--bg'),fg:g('--fg'),fg2:g('--fg2'),dim:g('--dim'),line:g('--line'),edge:g('--edge'),panel:g('--panel')};
}

/* ---------- build the radial tree ---------- */
function build(bin,txt){
  var dv=new DataView(bin); n=dv.getInt32(0,true); E=dv.getInt32(4,true);
  off=new Int32Array(bin.slice(8,8+4*(n+1))); tg=new Int32Array(bin.slice(8+4*(n+1),8+4*(n+1)+4*E));
  var ls=txt.split('\n'); if(ls[ls.length-1]==='') ls.pop();
  path=new Array(n); lower=new Array(n); start=new Int32Array(n); grp=new Uint8Array(n);
  var i,j,k,g,v,a;
  for(i=0;i<n;i++){ k=ls[i].indexOf('\t'); start[i]=+ls[i].slice(0,k); var p=ls[i].slice(k+1); path[i]=p; lower[i]=p.toLowerCase();
    var tm=/^(?:Def|Thm|S|D)_([A-Za-z0-9]+)(?:_|\.lean$)/.exec(p.slice(p.lastIndexOf('/')+1));
    for(g=0;g<NG-1;g++) if(tm&&tm[1]===GROUPS[g][0]) break;
    grp[i]=g; gcount[g]++; if(p==='FinalCheck.lean') MAIN=i; }
  roff=new Int32Array(n+1); for(k=0;k<E;k++) roff[tg[k]+1]++;
  for(i=0;i<n;i++) roff[i+1]+=roff[i];
  rtg=new Int32Array(E); var fill=roff.slice(0,n);
  for(i=0;i<n;i++) for(k=off[i];k<off[i+1];k++) rtg[fill[tg[k]]++]=i;
  var best=0; for(i=0;i<n;i++){ var d=roff[i+1]-roff[i]; if(d>best){best=d;mostUsed=i} }
  /* projects that state each theorem in Theorems/Thm_X.lean and prove it in P2M/Sol/S_X.lean:
     remember the pairs so the two files can be drawn as one */
  var idx=new Map(); for(i=0;i<n;i++) idx.set(path[i],i);
  part=new Int32Array(n).fill(-1); rep=new Int32Array(n); for(i=0;i<n;i++) rep[i]=i;
  for(i=0;i<n;i++) if(path[i].lastIndexOf('Theorems/Thm_',0)===0){
    var sv=idx.get('P2M/Sol/S_'+path[i].slice(13)); if(sv!==undefined){ part[i]=sv; rep[sv]=i; hasPairs=true } }
}
/* the import neighbours of v; with merge on, a statement and its proof act as one file */
function eachImport(v,f){
  var k,j;
  for(k=off[v];k<off[v+1];k++){ j=merge?rep[tg[k]]:tg[k]; if(j!==v) f(j) }
  if(merge&&part[v]>=0){ var sv=part[v]; for(k=off[sv];k<off[sv+1];k++){ j=rep[tg[k]]; if(j!==v) f(j) } }
}
function directImports(v){
  var seen=new Set(); eachImport(v,function(j){ seen.add(j) }); return Int32Array.from(seen);
}
function layout(m){
  merge=!!m&&hasPairs;
  var i,j,k,g,v,a,fill;
  hid=new Uint8Array(n); if(merge) for(i=0;i<n;i++) if(rep[i]!==i) hid[i]=1;

  /* breadth-first from the root along imports: ring = fewest import steps from it.
     Each file hangs off the first file that reached it (its parent in the tree). */
  dist=new Int32Array(n).fill(-1); par=new Int32Array(n).fill(-1); bfs=new Int32Array(n);
  var h=0,t=0; dist[MAIN]=0; bfs[t++]=MAIN;
  while(h<t){ v=bfs[h++]; eachImport(v,function(j){ if(dist[j]<0){ dist[j]=dist[v]+1; par[j]=v; bfs[t++]=j } }) }
  nR=dist[bfs[t-1]]+1;
  size=new Int32Array(n);
  for(i=t-1;i>=0;i--){ v=bfs[i]; size[v]+=1; if(par[v]>=0) size[par[v]]+=size[v] }
  kidOff=new Int32Array(n+1); for(i=0;i<n;i++) if(par[i]>=0) kidOff[par[i]+1]++;
  for(i=0;i<n;i++) kidOff[i+1]+=kidOff[i];
  kids=new Int32Array(n); fill=kidOff.slice(0,n);
  for(i=0;i<t;i++){ v=bfs[i]; if(par[v]>=0) kids[fill[par[v]]++]=v }
  /* children ordered by topic, then biggest branch first, so colours stay together */
  for(i=0;i<n;i++){ a=kidOff[i]; var b=kidOff[i+1]; if(b-a>1){
    var arr=Array.prototype.slice.call(kids.subarray(a,b)); arr.sort(function(x,y){ return (grp[x]-grp[y])||(size[y]-size[x])||(x-y) });
    for(j=0;j<arr.length;j++) kids[a+j]=arr[j] } }
  /* each file gets a slice of the circle proportional to how many files branch out from it */
  th=new Float64Array(n); wd=new Float64Array(n); var lo=new Float64Array(n);
  lo[MAIN]=-Math.PI/2; wd[MAIN]=TAU; th[MAIN]=0;
  for(i=0;i<t;i++){ v=bfs[i]; var pos=lo[v],tot=size[v]-1;
    for(k=kidOff[v];k<kidOff[v+1];k++){ j=kids[k]; var w=wd[v]*size[j]/tot; lo[j]=pos; wd[j]=w; th[j]=pos+w/2; pos+=w } }
  /* a proof file folded into its statement sits at the same place */
  for(i=0;i<n;i++) if(hid[i]){ v=rep[i]; dist[i]=dist[v]; th[i]=th[v]; wd[i]=wd[v] }
  /* per-ring lists sorted by angle, for hit testing */
  ringCount=new Int32Array(nR); for(i=0;i<n;i++) if(!hid[i]) ringCount[dist[i]]++;
  ringOff=new Int32Array(nR+1); for(i=0;i<nR;i++) ringOff[i+1]=ringOff[i]+ringCount[i];
  ringIds=new Int32Array(ringOff[nR]); fill=ringOff.slice(0,nR);
  for(i=0;i<n;i++) if(!hid[i]) ringIds[fill[dist[i]]++]=i;
  for(i=0;i<nR;i++){ var sub=Array.prototype.slice.call(ringIds.subarray(ringOff[i],ringOff[i+1])); sub.sort(function(x,y){return th[x]-th[y]}); ringIds.set(sub,ringOff[i]) }
  rad=new Float32Array(n); rad[MAIN]=0.2;
  for(i=1;i<nR;i++){ var c0=ringOff[i],c1=ringOff[i+1];
    for(k=c0;k<c1;k++){ v=ringIds[k];
      var gp=c1-c0===1?TAU:Math.min(k>c0?th[v]-th[ringIds[k-1]]:TAU, k<c1-1?th[ringIds[k+1]]-th[v]:TAU);
      rad[v]=Math.max(0.0015,Math.min(0.2,0.45*i*gp)) } }
  for(i=0;i<n;i++) if(hid[i]) rad[i]=rad[rep[i]];
  /* world-space paths: one per colour, drawn with the view transform */
  edgeP=[]; dotP=[];
  for(g=0;g<NG;g++){ edgeP.push(new Path2D()); dotP.push(new Path2D()) }
  for(i=0;i<n;i++){ if(i!==MAIN&&!hid[i]){ branch(edgeP[grp[i]],i); dot(dotP[grp[i]],i) } }
}
function wx(r,a){ return r*Math.cos(a) }
function wy(r,a){ return r*Math.sin(a) }
function branch(P,v){
  var p=par[v],r=dist[v],a=th[v],pa=p===MAIN?a:th[p];
  P.moveTo(wx(r-1,pa),wy(r-1,pa));
  P.bezierCurveTo(wx(r-0.55,pa),wy(r-0.55,pa),wx(r-0.45,a),wy(r-0.45,a),wx(r,a),wy(r,a));
}
function dotR(v){ return rad[v] }
function dot(P,v){ var r=dotR(v),x=wx(dist[v],th[v]),y=wy(dist[v],th[v]); P.moveTo(x+r,y); P.arc(x,y,r,0,TAU) }

/* ---------- view ---------- */
function resize(){
  dpr=window.devicePixelRatio||1; W=stage.clientWidth; H=stage.clientHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); buf.width=cv.width; buf.height=cv.height; bDirty=true;
}
function fit(){ fitS=(Math.min(W,H)/2-26)/(nR-1); s=fitS; tx=W/2; ty=H/2-6; bDirty=true; schedule() }
function sx(v){ return wx(dist[v],th[v])*s+tx }
function sy(v){ return wy(dist[v],th[v])*s+ty }
function zoomAt(f,cx,cy){
  var ns=Math.max(fitS*0.5,Math.min(fitS*4000,s*f)); f=ns/s; tx=cx-(cx-tx)*f; ty=cy-(cy-ty)*f; s=ns; bDirty=true; schedule();
}
function reveal(v){
  var x=sx(v),y=sy(v);
  if(x<40||x>W-40||y<40||y>H-40){ tx+=W/2-x; ty+=H/2-y; bDirty=true }
  schedule();
}
function nodeAt(px,py){
  if(!n) return -1;
  var x=(px-tx)/s,y=(py-ty)/s,r=Math.hypot(x,y),k=Math.round(r);
  if(k===0) return Math.hypot(px-tx,py-ty)<Math.max(8,0.3*s)?MAIN:-1;
  var bestV=-1,bestD=1e9;
  for(var kk=Math.max(1,k-1);kk<=Math.min(nR-1,k+1);kk++){
    var a=Math.atan2(y,x); if(a<-Math.PI/2) a+=TAU;
    var lo2=ringOff[kk],hi=ringOff[kk+1];
    if(lo2===hi) continue;
    var L=lo2,R=hi-1; while(L<R){ var m=(L+R)>>1; if(th[ringIds[m]]<a) L=m+1; else R=m }
    for(var q=Math.max(lo2,L-2);q<=Math.min(hi-1,L+1);q++){ var v=ringIds[q],d=Math.hypot(sx(v)-px,sy(v)-py); if(d<bestD){bestD=d;bestV=v} }
  }
  return bestD<=Math.max(7,dotR(bestV)*s+3)?bestV:-1;
}

/* ---------- selection ---------- */
function select(v,noReveal){
  if(v>=0&&hid[v]) v=rep[v];
  sel=v; iso=-1; selEdgeP=null; selDotP=[]; chainP=null; impP=null; nSub=0; nUp=0;
  if(v>=0){
    var g,i,k;
    selEdgeP=[]; for(g=0;g<NG;g++){ selEdgeP.push(new Path2D()); selDotP.push(new Path2D()) }
    /* the branch growing out of v in the circle */
    var st=[v];
    while(st.length){ var a=st.pop(); if(a!==MAIN){ branch(selEdgeP[grp[a]],a); dot(selDotP[grp[a]],a) } nSub++;

/* ---------- pointer, wheel, keys ---------- */
(function(){

  });

      if(lastD>0){ moveStamp(); zoomAt(d/lastD,(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2) } lastD=d; moved=99 }
  });

  }

  cv.addEventListener('wheel',function(e){ e.preventDefault(); var p=xy(e); moveStamp();
    var dy=e.deltaMode===1?e.deltaY*32:e.deltaY; zoomAt(Math.exp(-dy*(e.ctrlKey?0.01:0.0022)),p[0],p[1]); hideTip() },{passive:false});

})();
